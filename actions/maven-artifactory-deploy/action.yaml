name: 'Artifactory Deploy'
description: 'Deploy artifacts to Artifactory'

inputs:
  context-url:
    description: 'URI of the Artifactory server. Overrides artifactory.server'
    required: false
    default: ''
  username:
    description: 'Artifactory username. Overrides artifactory.username. Prefer settings-xml'
    required: false
    default: ''
  password:
    description: 'Artifactory password. Overrides artifactory.password. Prefer settings-xml'
    required: false
    default: ''
  build-name:
    description: 'Name of the build'
    required: true
  build-uri:
    description: 'URI of the build that produced the artifacts that are to be deployed'
    required: false
    default: "${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"
  project:
    description: 'BuildInfo Project in which build info should be stored. Overrides artifactory.project'
    required: false
    default: ''
  repository:
    description: 'Artifactory repository to which the artifacts should be deployed. Overrides artifactory.staging-repository'
    required: false
    default: ''
  skip-tests:
    description: 'Whether to skip tests during deployment'
    required: false
    default: 'false'
  goal:
    description: 'Maven deployment goal'
    required: false
    default: 'deploy'
  additional-options:
    description: 'Additional Maven options to pass during deployment'
    required: false
    default: ''
  settings-xml:
    description: 'Settings.xml to use during deployment'
    required: false
    default: ''

outputs:
  version:
    description: 'Effective project version'
    value: '${{ steps.pom-version.outputs.version }}'
  snapshot:
    description: 'Whether the project version is a snapshot version'
    value: '${{ steps.pom-version.outputs.snapshot }}'
  ci:
    description: 'Whether the project version is eligible for a regular CI build'
    value: '${{ steps.pom-version.outputs.ci }}'

runs:
  using: composite
  steps:
    - name: Setup POM version
      id: pom-version
      uses: spring-projects/spring-data-build/actions/setup-pom-version@main
      with:
        commercial: ${{ endsWith(inputs.build-name, '-commercial') }}
    - name: Write settings.xml
      if: ${{ inputs.settings-xml != '' && steps.pom-version.outputs.snapshot == 'true' }}
      shell: bash
      env:
        SETTINGS_XML: '${{ inputs.settings-xml }}'
      run: |
        echo "::notice::Writing provided settings-xml input to settings.xml"
        echo "${SETTINGS_XML}" > settings.xml
    - name: Deploy to Artifactory
      if: ${{ steps.pom-version.outputs.snapshot == 'true' }}
      shell: bash
      env:
        CONTEXT_URL: '${{ inputs.context-url }}'
        USERNAME: '${{ inputs.username }}'
        PASSWORD: '${{ inputs.password }}'
        REPOSITORY: '${{ inputs.repository }}'
        PROJECT: '${{ inputs.project }}'
        BUILD_NAME: '${{ inputs.build-name }}'
        BUILD_URI: '${{ inputs.build-uri }}'
        SKIP_TESTS: '${{ inputs.skip-tests }}'
        GOAL: '${{ inputs.goal }}'
        ADDITIONAL_OPTIONS: '${{ inputs.additional-options }}'
        BUILD_NUMBER: ${{ format('{0}-{1}-build-{2}', inputs.build-name, (github.head_ref || github.ref_name), github.run_number ) }}
      run: |
        ADDITIONAL_MAVEN_OPTS=()
        if [[ -f "settings.xml" ]]; then
          ADDITIONAL_MAVEN_OPTS+=("-s" "settings.xml")

          UNRESOLVED=()
          while read -r name; do
            if [[ -z "${!name:-}" ]]; then
              UNRESOLVED+=("${name}")
            fi
          done < <(grep -oE '\$\{env\.[A-Za-z_][A-Za-z0-9_]*\}' settings.xml | sed -E 's/^\$\{env\.(.*)\}$/\1/' | sort -u)
          if [[ ${#UNRESOLVED[@]} -gt 0 ]]; then
            if [[ -n "${USERNAME}" && -n "${PASSWORD}" ]]; then
              echo "::notice::settings.xml Using explicit username/password inputs."
            else
              echo "::error::settings.xml references environment variables that are unset or empty: ${UNRESOLVED[*]}"
              exit 1
            fi
          fi
        fi

        MAVEN_LOGGING_OPTS=()
        if [[ "${RUNNER_DEBUG}" == "1" || "${ACTIONS_STEP_DEBUG}" == "true" ]]; then
          echo "::notice::transfer-progress enabled"
        else
          MAVEN_LOGGING_OPTS+=(--no-transfer-progress)
        fi

        # Only pass the artifactory.* system properties that were actually supplied. A system
        # property takes precedence over settings.xml, so passing an empty one would silently
        # override the value settings.xml contributes.
        ARTIFACTORY_OPTS=()
        if [[ -n "${CONTEXT_URL}" ]]; then ARTIFACTORY_OPTS+=("-Dartifactory.server=${CONTEXT_URL}"); fi
        if [[ -n "${USERNAME}" ]]; then ARTIFACTORY_OPTS+=("-Dartifactory.username=${USERNAME}"); fi
        if [[ -n "${PASSWORD}" ]]; then ARTIFACTORY_OPTS+=("-Dartifactory.password=${PASSWORD}"); fi
        if [[ -n "${REPOSITORY}" ]]; then ARTIFACTORY_OPTS+=("-Dartifactory.staging-repository=${REPOSITORY}"); fi
        if [[ -n "${PROJECT}" ]]; then ARTIFACTORY_OPTS+=("-Dartifactory.project=${PROJECT}"); fi

        ./mvnw "${ADDITIONAL_MAVEN_OPTS[@]}" "${MAVEN_LOGGING_OPTS[@]}" -Pci,artifactory ${ADDITIONAL_OPTIONS} \
        "${ARTIFACTORY_OPTS[@]}" \
        -Dartifactory.build-name="${BUILD_NAME}" \
        -Dartifactory.build-number="${BUILD_NUMBER}" \
        -DBUILD_URL="${BUILD_URI}" \
        -Dmaven.test.skip=${SKIP_TESTS} -U -B\
        clean ${GOAL}
    - name: Test Summary
      uses: spring-projects/spring-data-build/actions/test-summary@main
      with:
        paths: '**/TEST-*.xml'
      if: ${{ always() && steps.pom-version.outputs.snapshot == 'true' }}
