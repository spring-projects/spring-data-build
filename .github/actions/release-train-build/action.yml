name: Build Release
runs:
  using: composite
  steps:
    - name: Write settings.xml
      if: ${{ env.RELEASE_TRAIN_SETTINGS_XML != '' }}
      shell: bash
      run: |
        echo "::notice::Writing provided settings-xml input to release-train-settings.xml"
        echo "${RELEASE_TRAIN_SETTINGS_XML}" > release-train-settings.xml
    - name: Build Release
      shell: bash
      run: |
        MAVEN_LOGGING_OPTS=()
        if [[ "${RUNNER_DEBUG}" == "1" || "${ACTIONS_STEP_DEBUG}" == "true" ]]; then
          echo "::notice::transfer-progress enabled"
        else
          MAVEN_LOGGING_OPTS+=(--no-transfer-progress)
        fi

        ./mvnw --batch-mode "${MAVEN_LOGGING_OPTS[@]}" --settings release-train-settings.xml clean deploy --activate-profiles releaseTrain,release,ci -DaltDeploymentRepository="release-train::file://$(pwd)/deployment-repository" -DskipTests -Dgpg.skip
